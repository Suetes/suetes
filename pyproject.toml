[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suetes"
version = "1.0"
description = "Suetes is a Differentiable Regional Weather Model (JAX)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Alex Bihlo" },
    { name = "Elsa Cardoso-Bihlo" },
    { name = "Alejandro Di Luca" },
    { name = "Seth Taylor" },
    { name = "Tim Whittaker" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-image",
    "jax>=0.10.0",
    "jaxlib>=0.10.0",
    "xarray",
    "cartopy",
    "pandas",
    "optax",
    "netcdf4",
    "cdsapi",
    "zarr>=3.0.0",
    "flax",
    "dinosaur",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings-python",
]
dev = [
    "build",
    "pytest",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings-python",
]

[project.urls]
Homepage = "https://github.com/Suetes/suetes"
Documentation = "https://suetes.github.io/suetes/"
Repository = "https://github.com/Suetes/suetes.git"
Issues = "https://github.com/Suetes/suetes/issues"

[tool.setuptools.packages.find]
include = ["suetes*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
