[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suetes"
version = "0.9.0"
description = "Suetes is a Differentiable Regional Weather Model (JAX)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-image",
    "jax>=0.10.0",
    "jaxlib>=0.10.0",
    "xarray",
    "cartopy",
    "pandas",
    "optax",
    "netcdf4",
    "cdsapi",
    "zarr>=3.0.0",
    "flax",
    "dinosaur",
    "pyyaml",
]

[tool.setuptools]
packages = ["suetes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
