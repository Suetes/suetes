site_name: Suêtes Documentation
site_description: Scientific and user documentation for the differentiable Suêtes atmospheric model
theme:
  name: material

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            docstring_options:
              returns_multiple_items: false
              returns_named_value: false
            filters:
              - "!^_"
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
    - Installation and quick start: getting-started.md
    - Architecture and data flow: architecture.md
    - Configuration reference: configuration.md
    - Scope and limitations: limitations.md
  - Scientific formulation:
    - Governing system: scientific-formulation.md
    - Model state and grid: model-state.md
    - Differentiability and adjoints: differentiability.md
    - Vertical coordinates and geometry: geometry.md
    - Discrete operators: operators.md
    - Dynamical core: euler.md
    - Time integration and advection: steppers.md
    - Lateral boundaries: boundaries.md
    - Diffusion and damping: diffusion.md
    - Physics and parameterizations: physics.md
  - Two-dimensional slice:
    - Geometry and grid: geometry2d.md
    - Discrete operators: operators2d.md
    - Dynamical core: euler2d.md
    - Time integration and advection: steppers2d.md
  - Data and preprocessing:
    - Workflow overview: era2suetes.md
    - ERA5 downloader: era5downloader.md
    - Data processor: processor.md
    - Topography blending: topography.md
  - Reproducibility:
    - Verification and evidence: verification.md
    - Manuscript experiment suite: paper_suite.md
    - NEUVE reachability diagnostic: neuve_reachability.md
    - Releasing and archiving: releasing.md
  - Visualization: visualizer.md
  - API reference:
    - Overview: api-reference.md
    - Regional 3D: api/regional3d.md
    - Two-dimensional slice: api/slice2d.md
    - Physics: api/physics.md
    - Shared infrastructure: api/shared.md
    - Preprocessing: api/preprocessing.md
    - Visualization: api/visualization.md
