site_name: Suetes Documentation
theme:
  name: material

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            filters: []

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# NEW: Define the sidebar navigation structure
nav:
  - Home: index.md
  - Vertical 2D Model:
    - Geometry & Grid: geometry2d.md
    - Spatial Operators: operators2d.md
    - Steppers & Advection: steppers2d.md
    - Dynamical Core (Euler): euler2d.md
  - Regional 3D Model:
    - Geometry & Grid: geometry.md
    - Spatial Operators: operators.md
    - Steppers & Advection: steppers.md
    - Dynamical Core (Euler): euler.md
    - Lateral Boundaries: boundaries.md
    - Physics & Parameterizations: physics.md
    - Diffusion: diffusion.md
  - Data & Preprocessing:
    - ERA5 Downloader: era5downloader.md
    - Data Processor: processor.md
    - Topography Blending: topography.md
    - ERA5 to Suetes (Bridge): era2suetes.md
  - Visualization:
    - Visualizer: visualizer.md