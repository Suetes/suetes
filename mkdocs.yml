site_name: Suetes Documentation

theme:
  name: material
  palette:
    scheme: slate 

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."] 

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# NEW: Define the sidebar navigation structure
nav:
  - Home: index.md
  - Regional 3D Model:
    - Geometry & Grid: geometry.md
    - Dynamical Core (Euler): euler.md
    - Steppers & Advection: steppers.md
    - Spatial Operators: operators.md
    - Grid Diffusion: diffusion.md
    - Lateral Boundaries: boundaries.md
    - Physics & Parameterizations: physics.md
  - Data & Preprocessing:
    - ERA5 Downloader: era5downloader.md
    - Data Processor: processor.md
    - Topography Blending: topography.md
    - ERA5 to Suetes (Bridge): era2suetes.md
  - Visualization:
    - Visualizer: visualizer.md