version = 1

# Commands are argument arrays, not shell strings. Available placeholders are
# {python}, {repo}, and {output_root}. Stages are skipped when all declared
# outputs exist, unless the runner is invoked with --force.

[[case]]
id = "rising_bubble"
group = "table"
description = "High-resolution dual-core rising thermal bubble"

[[case.stage]]
name = "simulate"
kind = "run"
command = [
  "{python}", "benchmarks/physical/rising_bubble_3d/run.py",
  "--dx", "25", "--dt", "0.5", "--t-end", "750",
  "--snapshot-interval", "150", "--stabilization", "0.05",
  "--output-root", "{output_root}", "--name", "paper", "--no-render",
]
outputs = ["{output_root}/benchmarks/rising_bubble_3d/paper/data/artifact.nc"]

[[case.stage]]
name = "render"
kind = "render"
command = [
  "{python}", "benchmarks/physical/rising_bubble_3d/render.py",
  "{output_root}/benchmarks/rising_bubble_3d/paper/data/artifact.nc",
  "--output-dir", "{output_root}/benchmarks/rising_bubble_3d/paper/figures",
]
outputs = [
  "{output_root}/benchmarks/rising_bubble_3d/paper/figures/rising_bubble_difference_main.png",
  "{output_root}/benchmarks/rising_bubble_3d/paper/figures/evolution.png",
]

