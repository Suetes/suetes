  "--dx", "1000", "--dz", "1000", "--dt", "0.5",
  "--spinup-end", "6600", "--window-end", "6750",
  "--diffusivity", "33.33", "--tracer-diffusivity", "0",
  "--divergence-damping", "0",
  "--output-dir", "{output_root}/experiments/squall_line_3d_sensitivity/paper/data",
]
outputs = [
  "{output_root}/experiments/squall_line_3d_sensitivity/paper/data/sensitivity.nc",
]

[[case.stage]]
