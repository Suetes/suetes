[[case]]
id = "neuve_pgf"
group = "table"
description = "PGF-trained NEUVE with tuned SLEVE and held-out evaluation"

[[case.stage]]
name = "train_neuve"
kind = "run"
command = [
  "{python}", "experiments/neuve_coordinates/train.py",
  "--target", "pgf_rest", "--terrain-family", "multiscale3d",
  "--seeds", "100,101,102,103,104,105,106,107,108,109",
  "--epochs", "90", "--minimum-layer-m", "150",
  "--output-root", "{output_root}", "--name", "paper", "--no-render",
]
outputs = [
  "{output_root}/experiments/neuve_coordinates/paper/data/neuve_coordinate.npz",
  "{output_root}/experiments/neuve_coordinates/paper/data/training_dataset.json",
  "{output_root}/experiments/neuve_coordinates/paper/data/neuve_training_history.npz",
  "{output_root}/experiments/neuve_coordinates/paper/data/training_complete.json",
]

[[case.stage]]
name = "tune_sleve"
kind = "run"
command = [
  "{python}", "experiments/neuve_coordinates/tune_sleve.py",
  "--dataset", "{output_root}/experiments/neuve_coordinates/paper/data/training_dataset.json",
  "--minimum-layer-m", "150",
  "--output-dir", "{output_root}/experiments/neuve_coordinates/paper/data",
  "--no-render",
]
outputs = [
  "{output_root}/experiments/neuve_coordinates/paper/data/best_sleve.json",
]

[[case.stage]]
name = "evaluate"
kind = "run"
command = [
  "{python}", "experiments/neuve_coordinates/evaluate.py",
  "--target", "pgf_rest", "--terrain-family", "multiscale3d",
  "--seeds", "200,201,202,203,204,205,206,207,208,209",
  "--output-root", "{output_root}", "--name", "paper", "--no-render",
]
outputs = [
  "{output_root}/experiments/neuve_coordinates/paper/data/coordinate_evaluation.nc",
]

[[case.stage]]
name = "render_training"
kind = "render"
command = [
  "{python}", "experiments/neuve_coordinates/render_training.py",
  "{output_root}/experiments/neuve_coordinates/paper",
  "--output-dir", "{output_root}/experiments/neuve_coordinates/paper/figures",
]
outputs = [
  "{output_root}/experiments/neuve_coordinates/paper/figures/neuve_training.png",
  "{output_root}/experiments/neuve_coordinates/paper/figures/sleve_tuning.png",
]

[[case.stage]]
name = "render_evaluation"
kind = "render"
command = [
  "{python}", "experiments/neuve_coordinates/render_evaluation.py",
  "{output_root}/experiments/neuve_coordinates/paper/data/coordinate_evaluation.nc",
  "--output-dir", "{output_root}/experiments/neuve_coordinates/paper/figures",
  "--plot-samples", "3",
]
outputs = [
  "{output_root}/experiments/neuve_coordinates/paper/figures/coordinate_sample_gallery.png",
]

